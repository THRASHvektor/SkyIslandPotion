# UE 社区调研种子源
# 每个条目产出一个候选列表，discover.py 轮询后去重+评分+排队
#
# ⚠️ 视频源（YouTube/Bilibili）已剔除自动轮询
# 视频链接由人工维护，见 Docs/ResearchPipeline/video-links.md
#
# 实测状态（2026-06-22，代理 127.0.0.1:7890）：
# - Bilibili 搜索 ✅（bili-cli，代理可用）
# - YouTube ✅（yt-dlp，代理可用）— 但已剔除自动轮询
# - Reddit ❌（需登录态）
# - RSS ❌（CAPTCHA 拦截）
# - GitHub ❌（API 超时）

# === Bilibili 搜索（可自动轮询）===
bilibili_search:
  - name: UE5 GAS 教程
    query: "UE5 GAS"
    type: video
    limit: 10
    trusted: true
    note: Gameplay Ability System 中文教程

  - name: UE5 动画蓝图
    query: "UE5 AnimBP 动画蓝图"
    type: video
    limit: 10
    trusted: true
    note: 动画系统中文教程

  - name: UE5 战斗系统
    query: "UE5 战斗系统 action RPG"
    type: video
    limit: 10
    trusted: true
    note: 战斗系统设计

  - name: UE5 Niagara 特效
    query: "UE5 Niagara 特效"
    type: video
    limit: 10
    trusted: true
    note: 特效系统

  - name: UE5 PCG 程序化
    query: "UE5 PCG 程序化生成"
    type: video
    limit: 10
    trusted: false
    note: 程序化内容生成

# === 关键词白名单（评分用）===
# 标题/描述命中这些词加分
keywords:
  core: [Unreal, UE5, UE4, 虚幻]
  systems: [GAS, GameplayAbilitySystem, AbilitySystem, Motion Matching, PoseSearch, Niagara, PCG, Lyra, GameplayCue]
  animation: [AnimBP, AnimBlueprint, Animation, Montage, BlendSpace, StateMachine, Retarget, IK]
  combat: [combat, 战斗, action RPG, melee, combo, weapon]
  cpp: [C++, plugin, module, UObject, Actor, Component]
  pipeline: [build, cooking, packaging, optimization, performance]
